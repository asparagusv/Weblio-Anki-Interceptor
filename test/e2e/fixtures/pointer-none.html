<!DOCTYPE html>
<meta charset="utf-8">
<title>pointer-events none on inline element</title>
<style>
  body { font: 20px/2 monospace; margin: 20px; }
  /* 文字の上にポインタを置いても elementFromPoint からはこの要素が消える */
  .unhittable { pointer-events: none; }
</style>
<p id="target">pointer <span class="unhittable">none</span> apple word</p>
